apiVersion: v1
kind: Namespace
metadata:
  name: velero-poc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: poc-config
  namespace: velero-poc
data:
  APP_NAME: "Velero Migration Demo"
  APP_ENV: "source-cluster"
  index.html: |
    <html>
      <body>
        <h1>Velero Migration POC</h1>
        <p>Application restored successfully!</p>
        <p>Check the environment configuration.</p>
      </body>
    </html>
---
apiVersion: v1
kind: Secret
metadata:
  name: poc-secret
  namespace: velero-poc
type: Opaque
stringData:
  DB_USERNAME: pocuser
  DB_PASSWORD: pocpassword123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-nginx
  namespace: velero-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poc-nginx
  template:
    metadata:
      labels:
        app: poc-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "250m"
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: poc-config
            - secretRef:
                name: poc-secret
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html-volume
          configMap:
            name: poc-config
---
apiVersion: v1
kind: Service
metadata:
  name: poc-nginx-service
  namespace: velero-poc
spec:
  selector:
    app: poc-nginx
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: poc-postgres
  namespace: velero-poc
spec:
  selector:
    app: poc-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: poc-postgres
  namespace: velero-poc
spec:
  serviceName: poc-postgres
  replicas: 1
  selector:
    matchLabels:
      app: poc-postgres
  template:
    metadata:
      labels:
        app: poc-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: poc-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poc-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: pocdb
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poc-ingress
  namespace: velero-poc
spec:
  ingressClassName: nginx
  rules:
    - host: poc.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poc-nginx-service
                port:
                  number: 80
